spring.application.name=smedico
spring.datasource.url=jdbc:mysql://localhost:3306/TU_BASE_DE_DATOS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=TU_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springdoc=DEBUG
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
#uploads.dir=uploads

# Ver SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Log del SQL (Hibernate)
logging.level.org.hibernate.SQL=DEBUG

# Ver valores de parametros (Hibernate 6 / Spring Boot 3)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

